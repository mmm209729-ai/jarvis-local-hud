<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. // LOCAL HUD</title>
    <style>
        :root {
            --bg-color: #050814;
            --panel-bg: rgba(10, 20, 35, 0.85);
            --border-color: #00ffcc55;
            --accent-color: #00ffcc;
            --text-main: #e0fbfc;
        }
        body { background: var(--bg-color); color: var(--text-main); font-family: monospace; padding: 20px; }
        header { display: flex; justify-content: space-between; border-bottom: 2px solid var(--accent-color); padding-bottom: 10px; margin-bottom: 20px; }
        h1 { margin: 0; color: var(--accent-color); font-size: 1.4rem; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media(max-width: 768px){ .grid { grid-template-columns: 1fr; } }
        .panel { background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 15px; }
        h2 { color: var(--accent-color); font-size: 1rem; border-bottom: 1px dashed var(--border-color); margin-top: 0; }
        ul { padding-left: 20px; }
        .chat-box { height: 180px; overflow-y: auto; background: rgba(0,0,0,0.4); border: 1px solid var(--border-color); padding: 10px; margin-bottom: 10px; }
        .chat-input { display: flex; gap: 10px; }
        input { flex: 1; background: #000; border: 1px solid var(--accent-color); color: #fff; padding: 8px; }
        button { background: var(--accent-color); color: #000; border: none; font-weight: bold; cursor: pointer; padding: 8px 15px; }
    </style>
</head>
<body>
    <header>
        <h1>J.A.R.V.I.S. // LOCALHOST HUD</h1>
        <div>STATUS: ONLINE 🟢</div>
    </header>

    <div class="grid">
        <div class="panel">
            <h2>📅 CALENDARIO & IMPEGNI</h2>
            <ul id="cal-list">Caricamento...</ul>
        </div>
        <div class="panel">
            <h2>🎯 BRIEFING GIORNALIERO</h2>
            <div id="briefing">Generazione briefing...</div>
        </div>
    </div>

    <div class="panel" style="margin-top:20px;">
        <h2>🤖 JARVIS CHAT</h2>
        <div class="chat-box" id="chat-box"></div>
        <div class="chat-input">
            <input type="text" id="user-msg" placeholder="Scrivi un messaggio..." onkeypress="if(event.key==='Enter') send()">
            <button onclick="send()">INVIA</button>
        </div>
    </div>

    <script>
        fetch('/api/calendar').then(r=>r.json()).then(d=>{
            let el = document.getElementById('cal-list');
            el.innerHTML = '';
            d.forEach(i=>{ el.innerHTML += `<li><strong>${i.date}</strong> — ${i.summary}</li>`; });
        });
        fetch('/api/briefing').then(r=>r.json()).then(d=>{
            document.getElementById('briefing').innerText = d.briefing;
        });
        function send(){
            let inp = document.getElementById('user-msg');
            let txt = inp.value.trim();
            if(!txt) return;
            let box = document.getElementById('chat-box');
            box.innerHTML += `<div>> <strong>Tu:</strong> ${txt}</div>`;
            inp.value = '';
            fetch('/api/chat', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({message: txt}) })
            .then(r=>r.json()).then(d=>{
                box.innerHTML += `<div>> <strong style="color:var(--accent-color)">JARVIS:</strong> ${d.reply}</div>`;
                box.scrollTop = box.scrollHeight;
            });
        }
    </script>
</body>
</html>
